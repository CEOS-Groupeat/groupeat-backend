spring:
  application:
    name: groupeat-backend

  jackson:
    time-zone: Asia/Seoul

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/groupeat
    username: ${DB_USERNAME:groupeat}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  signup-secret: ${JWT_SIGNUP_SECRET}
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  business-secret: ${JWT_BUSINESS_SECRET}

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    confirm-url: https://api.tosspayments.com/v1/payments/confirm
    cancel-base-url: https://api.tosspayments.com/v1/payments

nts:
  api:
    base-url: "https://api.odcloud.kr/api/nts-businessman/v1"
    service-key: ${NTS_SERVICE_KEY}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}

app:
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${AUTH_COOKIE_DOMAIN:}
    token:
      access-token-expiration-minutes: ${ACCESS_TOKEN_EXPIRATION_MINUTES:60}
      refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:14}
      signup-token-expiration-minutes: ${SIGNUP_TOKEN_EXPIRATION_MINUTES:10}
  frontend:
    oauth-redirect:
      base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
      customer-login-success-path: /customer/home
      business-login-success-path: /owner/home
      signup-path: /signup
      customer-signup-in-progress-path: /signup/customer
      business-signup-in-progress-path: /signup/business
  settlement:
    # TODO: 정산 수수료 정책 확정 후 운영 설정으로 조정
    platform-fee-rate: ${PLATFORM_FEE_RATE:5}
  business:
    validation:
      nts-bypass-enabled: ${BUSINESS_VALIDATION_NTS_BYPASS_ENABLED:false}
  notification:
    scheduler:
      enabled: ${NOTIFICATION_SCHEDULER_ENABLED:false}
      pickup-reminder-cron: ${PICKUP_REMINDER_CRON:0 0 9 * * *} # 매일 오전 9시
      deadline-check-fixed-delay-ms: ${ORDER_DEADLINE_CHECK_FIXED_DELAY_MS:600000}
      order-accept-deadline-warning-start-hours: ${ORDER_ACCEPT_DEADLINE_WARNING_START_HOURS:23}
      order-accept-deadline-warning-middle-hours: ${ORDER_ACCEPT_DEADLINE_WARNING_MIDDLE_HOURS:12}
      order-accept-deadline-warning-end-hours: ${ORDER_ACCEPT_DEADLINE_WARNING_END_HOURS:24}
  order:
    scheduler:
      enabled: ${ORDER_SCHEDULER_ENABLED:false}
      auto-reject-fixed-delay-ms: ${ORDER_AUTO_REJECT_FIXED_DELAY_MS:600000}
      accept-deadline-hours: ${ORDER_ACCEPT_DEADLINE_HOURS:24}
      auto-reject-batch-size: ${ORDER_AUTO_REJECT_BATCH_SIZE:100}
  business:
    validation-token:
      expiration-minutes: ${BUSINESS_VALIDATION_TOKEN_EXPIRATION_MINUTES:30}
  swagger:
    prod-server-url: ${SWAGGER_PROD_SERVER_URL:https://api.groupeat.co.kr}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
